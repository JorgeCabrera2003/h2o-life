<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#bae6fd" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle water ring -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Main Pure Water Droplet with glow -->
  <path
    d="M 256,76
       C 256,76 376,236 376,332
       A 120,120 0 1,1 136,332
       C 136,236 256,76 256,76 Z"
    fill="url(#dropGrad)"
    filter="url(#glow)"
  />

  <!-- Specular curved highlight on droplet -->
  <path
    d="M 220,165
       C 240,210 210,270 195,310
       C 188,328 178,320 182,305
       C 192,265 215,205 210,170
       C 208,155 216,155 220,165 Z"
    fill="#ffffff"
    fill-opacity="0.75"
  />

  <!-- Micro crystal dot -->
  <circle cx="305" cy="335" r="14" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="325" cy="365" r="7" fill="#ffffff" fill-opacity="0.6" />
</svg>
